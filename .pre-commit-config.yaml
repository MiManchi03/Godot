# 全局排除：第三方/内置资源不参与格式化与自检
exclude: '^addons/'

repos:
  - repo: local
    hooks:
      # 术语闸口：仅检查本次新增行，历史遗留不阻断
      # 追溯：红队演练 Gate A（术语检查崩溃）+ 审计 A1/A2（闸口失效）
      - id: terminology-check
        name: Terminology Consistency Check (new lines only)
        entry: python tools/check_terminology.py
        language: system
        files: '\.(gd|tscn|md|ya?ml|json|py)$'
        pass_filenames: true
        args: ["--added-lines-only"]
        verbose: true
        stages: [commit]

      # 架构闸口：_process 每帧分配 + 跨脚本私有成员访问
      # 追溯：红队演练 D1（未被拦截）
      - id: architecture-check
        name: Architecture Check (new lines only)
        entry: python tools/check_architecture.py
        language: system
        files: '\.gd$'
        pass_filenames: true
        args: ["--added-lines-only"]
        verbose: true
        stages: [commit]

      # 依赖白名单：project.godot 的 autoload 必须与 deps.allowlist.json 一致
      # 追溯：审计 A6/A12 drift
      - id: dependency-check
        name: Dependency Allowlist Check
        entry: python tools/check_dependencies.py
        language: system
        files: '^(project\.godot|deps\.allowlist\.json)$'
        pass_filenames: false
        verbose: true
        stages: [commit]

      # 范围守卫：变更必须落在 .harness/scope.txt 声明的白名单内
      # 追溯：红队演练 D4（"顺手"改无关文件，无机制发现）
      - id: scope-check
        name: Change Scope Guard
        entry: python tools/check_scope.py
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [commit]

      # 活文档新鲜度：改 scripts/**.gd 必须同批更新 STATUS.md / PITFALLS.md
      # 追溯：红队演练 D7（文档腐烂）
      - id: docs-fresh-check
        name: Living Docs Freshness
        entry: python tools/check_docs_fresh.py
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [commit]

      # 测试声明取证：带数字的测试/覆盖率结论必须有产物佐证
      # 追溯：红队演练 D5（虚假测试声明）
      - id: claims-check
        name: Test-Claim Evidence Check
        entry: python tools/check_claims.py
        language: system
        files: '\.(md|txt)$'
        pass_filenames: true
        args: ["--added-lines-only"]
        verbose: true
        stages: [commit]

      # 静态分析：gdtoolkit gdlint（纯 pip，无需引擎）
      # 追溯：审计 A6（无静态分析）
      - id: gdlint
        name: GDScript Lint (gdtoolkit)
        entry: python tools/run_gdlint.py
        language: system
        files: '\.gd$'
        pass_filenames: false
        verbose: true
        stages: [commit]

      # 单元测试：GUT 无头（需 Godot，路径由 GODOT_PATH 或默认值决定）
      # 追溯：红队演练 D2/D3（逻辑/边界无测试）
      - id: unit-tests
        name: Unit Tests (GUT headless)
        entry: python tools/run_tests.py
        language: system
        files: '\.(gd|tscn)$'
        pass_filenames: false
        verbose: true
        stages: [commit]

      # save schema 守卫：读写键对称 + 版本迁移
      # 追溯：红队演练 D6（改写出键不写迁移，未被拦截）
      - id: save-schema-check
        name: Save Schema Guard
        entry: python tools/check_save_schema.py
        language: system
        files: '^scripts/world/world_state\.gd$'
        pass_filenames: false
        verbose: true
        stages: [commit]

      # 契约校验：contract.json 声明的接口必须仍在脚本中存在
      # 追溯：审计 A8（契约腐烂）/ A12（原实现缺失）
      - id: contracts-check
        name: Contract Validation
        entry: python tools/validate_contracts.py
        language: system
        files: '(\.opencode/contracts/.*\.json$|\.gd$)'
        pass_filenames: false
        verbose: true
        stages: [commit]

      # （已由 gdtoolkit + GUT 取代）原 godot --check-only 方案作废
      # - id: godot-static-analyzer
      #   name: GDScript Static Analysis
      #   entry: godot
      #   language: system
      #   types: [gdscript]
      #   args: ["--headless", "--check-only"]
      #   pass_filenames: true
      #   stages: [commit]
      #   require_serial: true

      # 已移除本地 trailing-whitespace / end-of-file-fixer / check-yaml / check-json：
      #   - 空白钩子实现 open(f,'w').write(open(f).read()) 会先截断再读，导致文件被清空
      #   - check-yaml/check-json 以默认 GBK 编码读取，遇 UTF-8 中文即崩溃
      # 追溯：演练 D0（文件被清空）；Phase 2 提交（GBK 崩溃）
      # 全部改用下方 pre-commit/pre-commit-hooks 的官方实现

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
