repos:
  - repo: local
    hooks:
      # 术语闸口：仅检查本次新增行，历史遗留不阻断
      # 追溯：红队演练 Gate A（术语检查崩溃）+ 审计 A1/A2（闸口失效）
      - id: terminology-check
        name: Terminology Consistency Check (new lines only)
        entry: python tools/check_terminology.py
        language: system
        files: '\.(gd|tscn|md|ya?ml|json|py)$'
        pass_filenames: true
        args: ["--added-lines-only"]
        verbose: true
        stages: [commit]
      
      # 暂缓：godot --check-only 不能直接作为逐文件脚本检查器；
      # 阶段 4 将以 gdtoolkit(gdscript-lint) + Godot 无头测试替代
      # - id: godot-static-analyzer
      #   name: GDScript Static Analysis
      #   entry: godot
      #   language: system
      #   types: [gdscript]
      #   args: ["--headless", "--check-only"]
      #   pass_filenames: true
      #   stages: [commit]
      #   require_serial: true
      
      # 已移除本地 trailing-whitespace / end-of-file-fixer：
      # 其实现 open(f,'w').write(open(f).read()) 会先截断再读，导致文件被清空
      # 追溯：演练 D0 中该缺陷把 scripts/drill_d0_bad.gd 清空
      # 改用下方 pre-commit/pre-commit-hooks 的官方实现
      - id: check-yaml
        name: Check YAML Syntax
        entry: python -c "import yaml, sys; [yaml.safe_load(open(f)) for f in sys.argv[1:]]"
        language: system
        files: '\.ya?ml$'
        stages: [commit]
      
      - id: check-json
        name: Check JSON Syntax
        entry: python -c "import json, sys; [json.load(open(f)) for f in sys.argv[1:]]"
        language: system
        files: '\.json$'
        stages: [commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key