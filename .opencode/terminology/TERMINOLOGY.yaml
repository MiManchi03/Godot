# TERMINOLOGY.yaml
# 术语单一事实来源 - 所有术语的唯一权威定义
# 维护规则：
# 1. canonical 为代码/技能/映射表/文档统一使用的标准词
# 2. aliases 为允许的别名（大小写不敏感）
# 3. forbidden 为禁止词（出现即报错）
# 4. 新增概念必须先在此注册，再生成代码

entities:
