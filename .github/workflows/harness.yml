name: Harness CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  verify:
    name: verify.sh (terminology + architecture + deps + gdlint + unit tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install pyyaml gdtoolkit

      - name: Setup Godot
        uses: firebelley/setup-godot@v2
        with:
          version: "4.6.1"

      - name: Resolve base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run verify.sh
        run: bash verify.sh --base "${{ steps.base.outputs.ref }}"

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - name: Done
        run: echo "All Harness CI checks passed"
